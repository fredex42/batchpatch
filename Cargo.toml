[package]
name = "batchpatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
colog = "1.4.0"
git2 = "0.21.0"
homedir = "0.3.6"
log = "0.4.34"
octorust = { version = "0.10.0", features = ["openssl", "httpcache"] }
regex = "1.13.1"
serde = "1.0.229"
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "net"] }
